name = "epsa-redcap-proxy"
main = "redcap-proxy.js"
compatibility_date = "2026-06-17"

# CANONICAL. The epsa-screening-tool repo used to define a Worker of this same
# name from a different source file. Both deployed to the same account, so
# whichever shipped last replaced the other — and only one had rate limiting.
# That duplicate has been removed; deploy this Worker only from this repo.

# Secrets (set once, never in code):
#   wrangler secret put REDCAP_TOKEN   --config worker/wrangler.toml
#   wrangler secret put REDCAP_API_URL --config worker/wrangler.toml
#
# DASHBOARD_SECRET is no longer used. Both routes now require a verified
# Mount Sinai Entra token instead of a static shared secret. Remove the old
# value once this is deployed:
#   wrangler secret delete DASHBOARD_SECRET --config worker/wrangler.toml

[vars]
# Public identifiers, not secrets — the same values the browser uses for MSAL
# login. Token verification compares a token's `aud` against AZURE_CLIENT_ID,
# so these MUST be set or every request is rejected.
AZURE_CLIENT_ID = "38873359-3e5d-46a4-9b0c-6c8b682b2d6e"
AZURE_TENANT_ID = "77e89d61-570f-43b0-b9e4-634f462e34b8"

# Comma-separated EXACT origins permitted to call this Worker (no wildcards,
# no trailing slash): the screening tool submits records, the admin dashboard
# reads them back.
#
# epsa.mssm.edu is the screening tool's production domain — the one staff
# actually use. Listing only its vercel.app platform hostname meant every
# REDCap submission from the real site was refused with 403 before the token
# was even examined.
#
# Both apps authenticate against the SAME Azure app registration
# (38873359-...), so AZURE_CLIENT_ID above is a single value. It is parsed as a
# comma-separated allowlist, so a second registration can be added without a
# code change. Defence in depth only — the Entra token check
# is the actual access control, since an Origin header means nothing outside a
# browser. ALLOWED_ORIGIN (singular) is still honoured for back-compat.
ALLOWED_ORIGINS = "https://epsa.mssm.edu,https://epsa-screening-tool.vercel.app,https://epsa-admin-dashboard.pages.dev"

# Rate limiting is keyed on the authenticated identity. Without this binding
# the limiter silently no-ops, so create the namespace before going live:
#   wrangler kv namespace create RATE_LIMIT_KV
# then paste the id below and uncomment.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<your-kv-namespace-id>"
